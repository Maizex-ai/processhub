<!-- Содержимое ниже включается в конец <head> превью MPE (и экспорта).
     Здесь живёт клиентский JS: модалка для диаграмм (зум + панорама) и кнопка
     "раскрыть". Раньше этот скрипт инжектился через parser.js.onDidParseMarkdown,
     но тот HTML прогоняется через DOMPurify и <script> вырезался — поэтому кнопка
     не появлялась. head.html грузится как часть документа и исполняется штатно. -->
<script>
(function () {
  if (window.__mpeDiagZoom) return;
  window.__mpeDiagZoom = true;

  var st = { s: 1, tx: 0, ty: 0, drag: false, lx: 0, ly: 0 };
  var overlay, stage, content;

  function apply() {
    content.style.transform =
      'translate(' + st.tx + 'px,' + st.ty + 'px) scale(' + st.s + ')';
  }
  function zoomBy(f) {
    st.s = Math.min(10, Math.max(0.1, st.s * f));
    apply();
  }
  function fit() {
    st.s = 1; st.tx = 0; st.ty = 0; apply();
    requestAnimationFrame(function () {
      var sr = stage.getBoundingClientRect();
      var cr = content.getBoundingClientRect();
      if (cr.width && cr.height) {
        var k = Math.min((sr.width - 80) / cr.width, (sr.height - 80) / cr.height, 1);
        if (k > 0 && isFinite(k)) st.s = k;
        apply();
      }
    });
  }
  function close() { overlay.classList.remove('open'); content.innerHTML = ''; }
  function open(node) {
    if (!node) return;
    if (!overlay) build();
    content.innerHTML = '';
    content.appendChild(node.cloneNode(true));
    overlay.classList.add('open');
    fit();
  }
  function build() {
    overlay = document.createElement('div');
    overlay.className = 'diag-modal';
    overlay.innerHTML =
      '<div class="diag-modal__stage"><div class="diag-modal__content"></div></div>' +
      '<div class="diag-modal__bar">' +
      '<button data-a="in" title="Приблизить">+</button>' +
      '<button data-a="out" title="Отдалить">\u2212</button>' +
      '<button data-a="reset" title="По размеру окна">\u21BA</button>' +
      '<button data-a="close" title="Закрыть">\u2715</button>' +
      '</div>';
    document.body.appendChild(overlay);
    stage = overlay.querySelector('.diag-modal__stage');
    content = overlay.querySelector('.diag-modal__content');
    overlay.querySelector('.diag-modal__bar').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return; e.stopPropagation();
      var a = b.getAttribute('data-a');
      if (a === 'in') zoomBy(1.25);
      else if (a === 'out') zoomBy(0.8);
      else if (a === 'reset') fit();
      else close();
    });
    stage.addEventListener('wheel', function (e) {
      e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.1 : 0.9);
    }, { passive: false });
    stage.addEventListener('mousedown', function (e) {
      st.drag = true; st.lx = e.clientX; st.ly = e.clientY; stage.classList.add('grabbing');
    });
    window.addEventListener('mousemove', function (e) {
      if (!st.drag) return;
      st.tx += e.clientX - st.lx; st.ty += e.clientY - st.ly;
      st.lx = e.clientX; st.ly = e.clientY; apply();
    });
    window.addEventListener('mouseup', function () {
      st.drag = false; stage.classList.remove('grabbing');
    });
    stage.addEventListener('click', function (e) { if (e.target === stage) close(); });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay && overlay.classList.contains('open')) close();
    });
  }

  function inner(box) {
    return box.querySelector('svg') || box.querySelector('img') || box;
  }
  function root() {
    return document.querySelector('.markdown-preview') || document.body;
  }

  // Ищем диаграммы по факту, не завязываясь на классы MPE:
  //  1) блоки Mermaid (.mermaid);
  //  2) картинки-диаграммы (<img> с data-URI или plantuml/kroki/graphviz в src);
  //  3) крупные инлайн-<svg> (PlantUML/Graphviz часто рендерятся инлайном).
  function collect() {
    var r = root(), seen = [], out = [];
    function add(el) { if (el && seen.indexOf(el) < 0) { seen.push(el); out.push(el); } }
    r.querySelectorAll('.mermaid').forEach(add);
    r.querySelectorAll('img').forEach(function (img) {
      if (img.closest('.diag-modal') || img.closest('.diag-expand')) return;
      var s = img.getAttribute('src') || '';
      if (/plantuml|kroki|graphviz|\bviz\b|\bdot\b/i.test(s) ||
          /^data:image\/(svg|png)/i.test(s)) add(img);
    });
    r.querySelectorAll('svg').forEach(function (svg) {
      if (svg.closest('.mermaid') || svg.closest('.diag-modal') || svg.closest('.diag-expand')) return;
      var w = 0; try { w = svg.getBoundingClientRect().width; } catch (e) {}
      if (w >= 100) add(svg);
    });
    return out;
  }

  // Если диаграмма — единственный ребёнок <p>, оборачиваем весь <p>.
  function hostFor(el) {
    var p = el.parentElement;
    if (p && p.tagName === 'P' && p.children.length === 1) return p;
    return el;
  }

  function decorate() {
    var list = collect();
    for (var i = 0; i < list.length; i++) {
      var el = list[i];
      var box = hostFor(el);
      if (box.__diag) continue;
      if (box.closest && (box.closest('.diag-host') || box.closest('.diag-modal'))) continue;
      box.__diag = true;
      var wrap = document.createElement('div');
      wrap.className = 'diag-host';
      box.parentNode.insertBefore(wrap, box);
      wrap.appendChild(box);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'diag-expand';
      btn.title = 'Раскрыть на весь экран';
      btn.innerHTML =
        "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M8 3H5a2 2 0 0 0-2 2v3'/><path d='M21 8V5a2 2 0 0 0-2-2h-3'/><path d='M3 16v3a2 2 0 0 0 2 2h3'/><path d='M16 21h3a2 2 0 0 0 2-2v-3'/></svg>";
      (function (target) {
        btn.addEventListener('click', function (ev) {
          ev.preventDefault(); ev.stopPropagation(); open(inner(target));
        });
      })(el);
      wrap.appendChild(btn);
    }
  }

  var t;
  function start() {
    decorate();
    try {
      var mo = new MutationObserver(function () {
        clearTimeout(t); t = setTimeout(decorate, 150);
      });
      mo.observe(document.body, { childList: true, subtree: true });
    } catch (e) {}
    setTimeout(decorate, 400);
    setTimeout(decorate, 1200);
    setTimeout(decorate, 2500);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
