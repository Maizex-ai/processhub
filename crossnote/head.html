<!-- Содержимое включается в <head> превью MPE (crossnote: head.html -> includeInHeader).
     Клиентский JS: кнопка "раскрыть" над диаграммой + полноэкранная модалка (зум/панорама).

     ВАЖНО (архитектура): превью MPE — React-приложение. Менять его DOM
     (оборачивать диаграммы, вставлять узлы внутрь контента) НЕЛЬЗЯ — React
     затирает чужие изменения при перерисовке. Поэтому:
       - кнопка и модалка живут в document.body, ВНЕ дерева контента;
       - кнопка позиционируется поверх диаграммы (position: fixed) по mouseover;
       - контент мы только ЧИТАЕМ (getBoundingClientRect, cloneNode). -->
<script>
(function () {
  if (window.__mpeDiagZoom) return;
  window.__mpeDiagZoom = true;

  // ===== ВРЕМЕННАЯ ДИАГНОСТИКА (удалить после проверки) =====
  var dbgEl;
  function dbg(msg) {
    try {
      if (!dbgEl) {
        dbgEl = document.createElement('div');
        dbgEl.style.cssText =
          'position:fixed;bottom:8px;left:8px;z-index:2147483647;' +
          'background:#0a7d32;color:#fff;font:11px/1.4 monospace;' +
          'padding:5px 9px;border-radius:6px;white-space:pre;pointer-events:none;' +
          'max-width:60vw;overflow:hidden;';
        (document.body || document.documentElement).appendChild(dbgEl);
      }
      dbgEl.textContent = msg;
    } catch (e) {}
  }
  function describe(el) {
    if (!el) return 'null';
    var s = el.tagName.toLowerCase();
    if (el.className && typeof el.className === 'string') {
      s += '.' + el.className.trim().split(/\s+/).slice(0, 2).join('.');
    }
    var p = el.parentElement;
    if (p) {
      var ps = p.tagName.toLowerCase();
      if (p.className && typeof p.className === 'string') {
        ps += '.' + p.className.trim().split(/\s+/).slice(0, 2).join('.');
      }
      s = ps + ' > ' + s;
    }
    try {
      var r = el.getBoundingClientRect();
      s += ' [' + Math.round(r.width) + 'x' + Math.round(r.height) + ']';
    } catch (e) {}
    return s;
  }
  // ===== /ДИАГНОСТИКА =====

  var btn = null, overlay = null, stage = null, content = null;
  var curHost = null, hideTimer = null;
  var st = { s: 1, tx: 0, ty: 0, drag: false, lx: 0, ly: 0 };

  function rectW(el) {
    try { return el.getBoundingClientRect().width; } catch (e) { return 0; }
  }

  // Если диаграмма — единственный ребёнок <p>, считаем "карточкой" весь <p>.
  function wrapperOf(el) {
    var p = el.parentElement;
    if (p && p.tagName === 'P' && p.children.length === 1) return p;
    return el;
  }

  // Определяем, является ли элемент (или его предок) диаграммой.
  // Возвращаем элемент-карточку, над которой показываем кнопку.
  function diagHostFromTarget(el) {
    if (!el || el.nodeType !== 1 || !el.closest) return null;
    if (el.closest('.diag-modal') || el.closest('.diag-expand')) return null;
    var m = el.closest('.mermaid');
    if (m) return m;
    var card = el.closest('.plantuml, pre.mume-plantuml');
    if (card) return card;
    var svg = el.closest('svg');
    if (svg && rectW(svg) >= 80) return wrapperOf(svg);
    var img = el.tagName === 'IMG' ? el : el.closest('img');
    if (img) {
      var s = img.getAttribute('src') || '';
      if (/plantuml|kroki|graphviz/i.test(s) || /^data:image\//i.test(s) ||
          rectW(img) >= 120) return wrapperOf(img);
    }
    return null;
  }

  function innerOf(host) {
    if (host.matches && (host.matches('svg') || host.matches('img'))) return host;
    return host.querySelector('svg') || host.querySelector('img') || host;
  }

  // --- Кнопка (одна на документ, живёт в body) ---
  function ensureBtn() {
    if (btn) return btn;
    btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'diag-expand';
    btn.title = 'Раскрыть на весь экран';
    btn.innerHTML =
      "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M8 3H5a2 2 0 0 0-2 2v3'/><path d='M21 8V5a2 2 0 0 0-2-2h-3'/><path d='M3 16v3a2 2 0 0 0 2 2h3'/><path d='M16 21h3a2 2 0 0 0 2-2v-3'/></svg>";
    btn.addEventListener('click', function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      if (curHost) openModal(innerOf(curHost));
    });
    btn.addEventListener('mouseover', function () { clearTimeout(hideTimer); });
    document.body.appendChild(btn);
    return btn;
  }

  function placeBtn(host) {
    var r = host.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return hideBtn();
    var b = ensureBtn();
    b.style.top = Math.max(8, r.top + 10) + 'px';
    b.style.left = Math.max(8, r.right - 40) + 'px';
    b.classList.add('show');
  }

  function showBtn(host) {
    clearTimeout(hideTimer);
    curHost = host;
    placeBtn(host);
  }

  function hideBtn() {
    if (btn) btn.classList.remove('show');
    curHost = null;
  }

  function scheduleHide() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideBtn, 250);
  }

  // Делегирование: одно слушание на документ, никакой привязки к структуре DOM.
  document.addEventListener('mouseover', function (e) {
    var host = diagHostFromTarget(e.target);
    if (host) { showBtn(host); return; }
    if (btn && (e.target === btn || btn.contains(e.target))) {
      clearTimeout(hideTimer);
      return;
    }
    scheduleHide();
  }, true);

  // При прокрутке/ресайзе кнопка следует за диаграммой (или прячется).
  function onViewportChange() {
    if (curHost && btn && btn.classList.contains('show')) {
      if (!document.contains(curHost)) return hideBtn();
      placeBtn(curHost);
    }
  }
  window.addEventListener('scroll', onViewportChange, { capture: true, passive: true });
  window.addEventListener('resize', onViewportChange, { passive: true });

  // --- Модалка (зум + панорама), тоже в body, вне React-дерева ---
  function apply() {
    content.style.transform =
      'translate(' + st.tx + 'px,' + st.ty + 'px) scale(' + st.s + ')';
  }
  function zoomBy(f) {
    st.s = Math.min(10, Math.max(0.1, st.s * f));
    apply();
  }
  function fit() {
    st.s = 1; st.tx = 0; st.ty = 0; apply();
    requestAnimationFrame(function () {
      var sr = stage.getBoundingClientRect();
      var cr = content.getBoundingClientRect();
      if (cr.width && cr.height) {
        var k = Math.min((sr.width - 80) / cr.width, (sr.height - 80) / cr.height, 1);
        if (k > 0 && isFinite(k)) st.s = k;
        apply();
      }
    });
  }
  function closeModal() { overlay.classList.remove('open'); content.innerHTML = ''; }
  function openModal(node) {
    if (!node) return;
    if (!overlay) buildModal();
    content.innerHTML = '';
    content.appendChild(node.cloneNode(true));
    overlay.classList.add('open');
    fit();
  }
  function buildModal() {
    overlay = document.createElement('div');
    overlay.className = 'diag-modal';
    overlay.innerHTML =
      '<div class="diag-modal__stage"><div class="diag-modal__content"></div></div>' +
      '<div class="diag-modal__bar">' +
      '<button data-a="in" title="Приблизить">+</button>' +
      '<button data-a="out" title="Отдалить">\u2212</button>' +
      '<button data-a="reset" title="По размеру окна">\u21BA</button>' +
      '<button data-a="close" title="Закрыть">\u2715</button>' +
      '</div>';
    document.body.appendChild(overlay);
    stage = overlay.querySelector('.diag-modal__stage');
    content = overlay.querySelector('.diag-modal__content');
    overlay.querySelector('.diag-modal__bar').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return; e.stopPropagation();
      var a = b.getAttribute('data-a');
      if (a === 'in') zoomBy(1.25);
      else if (a === 'out') zoomBy(0.8);
      else if (a === 'reset') fit();
      else closeModal();
    });
    stage.addEventListener('wheel', function (e) {
      e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.1 : 0.9);
    }, { passive: false });
    stage.addEventListener('mousedown', function (e) {
      st.drag = true; st.lx = e.clientX; st.ly = e.clientY;
      stage.classList.add('grabbing');
    });
    window.addEventListener('mousemove', function (e) {
      if (!st.drag) return;
      st.tx += e.clientX - st.lx; st.ty += e.clientY - st.ly;
      st.lx = e.clientX; st.ly = e.clientY; apply();
    });
    window.addEventListener('mouseup', function () {
      st.drag = false; stage.classList.remove('grabbing');
    });
    stage.addEventListener('click', function (e) { if (e.target === stage) closeModal(); });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay && overlay.classList.contains('open')) closeModal();
    });
  }

  // --- Диагностический отчёт (только чтение DOM, React не трогаем) ---
  function report() {
    try {
      var svgs = document.querySelectorAll('.markdown-preview svg, body svg');
      var imgs = document.querySelectorAll('.markdown-preview img, body img');
      var mers = document.querySelectorAll('.mermaid');
      var first = null;
      for (var i = 0; i < svgs.length; i++) {
        if (!svgs[i].closest('.diag-modal') && !svgs[i].closest('.diag-expand') &&
            rectW(svgs[i]) >= 80) { first = svgs[i]; break; }
      }
      if (!first) {
        for (var j = 0; j < imgs.length; j++) {
          if (rectW(imgs[j]) >= 120) { first = imgs[j]; break; }
        }
      }
      dbg('DIAG v3 OK  mermaid=' + mers.length + ' svg=' + svgs.length +
          ' img=' + imgs.length + '\nfirst: ' + describe(first));
    } catch (e) { dbg('DIAG v3 error: ' + e); }
  }

  function start() {
    report();
    try {
      var t;
      var mo = new MutationObserver(function () {
        clearTimeout(t); t = setTimeout(report, 300);
      });
      mo.observe(document.body, { childList: true, subtree: true });
    } catch (e) {}
    setTimeout(report, 1000);
    setTimeout(report, 3000);
    setTimeout(report, 6000);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
